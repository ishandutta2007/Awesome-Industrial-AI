<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .pulse {
        animation: pulseWave 3s ease-in-out infinite alternate;
      }
      .node-pulse {
        animation: blink 2s ease-in-out infinite;
      }
      @keyframes pulseWave {
        0% { stroke-dashoffset: 0; opacity: 0.7; }
        50% { stroke-dashoffset: 120; opacity: 1; }
        100% { stroke-dashoffset: 240; opacity: 0.7; }
      }
      @keyframes blink {
        0%, 100% { r: 5; opacity: 0.4; }
        50% { r: 8; opacity: 1; filter: drop-shadow(0 0 8px #00f5d4); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Industrial AI Waves / Sensor Signals -->
  <path d="M 50,300 Q 150,220 250,300 T 450,300 T 650,260 T 850,320 T 1050,280 T 1150,300" 
        fill="none" stroke="#4361ee" stroke-width="2.5" stroke-dasharray="10 5" opacity="0.5" class="pulse"/>
  
  <path d="M 50,280 Q 200,160 350,280 T 650,280 T 950,220 T 1150,280" 
        fill="none" stroke="url(#neonCyan)" stroke-width="3.5" filter="url(#glow)" stroke-dasharray="8 4" class="pulse"/>

  <!-- Dynamic Sensor Nodes -->
  <circle cx="200" cy="220" r="6" fill="#00f5d4" class="node-pulse"/>
  <circle cx="500" cy="280" r="6" fill="#00bbf9" class="node-pulse" style="animation-delay: 0.5s;"/>
  <circle cx="800" cy="250" r="6" fill="#f72585" class="node-pulse" style="animation-delay: 1s;"/>
  <circle cx="1050" cy="280" r="6" fill="#00f5d4" class="node-pulse" style="animation-delay: 1.5s;"/>

  <!-- Main Title & Branding -->
  <text x="80" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="1">
    AWESOME <tspan fill="url(#neonCyan)">INDUSTRIAL AI</tspan>
  </text>
  
  <text x="80" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    Predictive Maintenance • Condition Monitoring • Edge IIoT • Asset Reliability
  </text>

  <!-- Status Tags -->
  <g transform="translate(80, 240)">
    <rect width="170" height="34" rx="17" fill="#00f5d4" fill-opacity="0.15" stroke="#00f5d4" stroke-width="1.2"/>
    <text x="85" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#00f5d4" text-anchor="middle">SaaS &amp; Platforms</text>
    
    <rect x="185" width="190" height="34" rx="17" fill="#4361ee" fill-opacity="0.2" stroke="#4361ee" stroke-width="1.2"/>
    <text x="280" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#82aaff" text-anchor="middle">Open-Source AI &amp; MLOps</text>

    <rect x="390" width="150" height="34" rx="17" fill="#f72585" fill-opacity="0.15" stroke="#f72585" stroke-width="1.2"/>
    <text x="465" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f72585" text-anchor="middle">Smart Sensors &amp; IoT</text>
  </g>
</svg>
